<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet" data-density="comfortable">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="description" content="Orphan Knowledge — a feature-rich, self-contained social platform. Single-file, no backend.">
<title>Orphan Knowledge</title>
<style>
/* ============================================================
   ORPHAN KNOWLEDGE  —  single-file social platform
   All CSS + JS inline. No backend. Storage: IndexedDB + localStorage.
   Sync across browser tabs: BroadcastChannel API.
   ============================================================ */

/* ---------- 0. Reset & tokens ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
img,video,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
:root{
  /* color tokens — dark default */
  --bg:        #0a0a0f;
  --bg-soft:   #11111a;
  --surface:   #16161f;
  --surface-2: #1c1c28;
  --surface-3: #24242f;
  --border:    rgba(255,255,255,.08);
  --border-2:  rgba(255,255,255,.14);
  --text:      #f4f4f7;
  --text-soft: #b8b8c8;
  --text-mute: #7c7c8e;
  --danger:    #ff5a6e;
  --success:   #3ddc97;
  --warning:   #ffb547;
  --info:      #5ac8fa;
  /* accents (overridden by [data-accent]) */
  --accent:    #8b5cf6;
  --accent-2:  #6366f1;
  --accent-3:  #a78bfa;
  --accent-soft: rgba(139,92,246,.14);
  --accent-contrast:#fff;
  /* density */
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:22px; --r-full:999px;
  --gap-xs:4px; --gap-sm:8px; --gap-md:14px; --gap-lg:22px; --gap-xl:32px;
  --pad-xs:6px; --pad-sm:10px; --pad-md:14px; --pad-lg:20px; --pad-xl:30px;
  --fs-xs:12px; --fs-sm:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:20px; --fs-2xl:24px; --fs-3xl:30px;
  --lh:1.55;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 6px 22px rgba(0,0,0,.4);
  --sh-3:0 18px 60px rgba(0,0,0,.55);
  --tr-fast:.14s ease;
  --tr:.26s cubic-bezier(.2,.7,.2,1);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji";
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --max-w:1320px;
  --nav-w:240px;
  --rail-w:320px;
}
[data-density="compact"]{--gap-md:8px;--gap-lg:14px;--pad-md:8px;--pad-lg:12px;--fs-md:14px}
[data-density="spacious"]{--gap-md:18px;--gap-lg:30px;--pad-md:18px;--pad-lg:26px;--fs-md:16px}

/* light theme */
[data-theme="light"]{
  --bg:#f6f6fb; --bg-soft:#ececf3; --surface:#fff; --surface-2:#f3f3f8; --surface-3:#e7e7ef;
  --border:rgba(20,20,40,.10); --border-2:rgba(20,20,40,.18);
  --text:#0e0e16; --text-soft:#3a3a4a; --text-mute:#6c6c7e;
  --sh-1:0 1px 2px rgba(20,20,40,.08); --sh-2:0 8px 24px rgba(20,20,40,.10); --sh-3:0 22px 60px rgba(20,20,40,.18);
}
/* auto theme follows system */
@media (prefers-color-scheme: light){
  [data-theme="auto"]{
    --bg:#f6f6fb; --bg-soft:#ececf3; --surface:#fff; --surface-2:#f3f3f8; --surface-3:#e7e7ef;
    --border:rgba(20,20,40,.10); --border-2:rgba(20,20,40,.18);
    --text:#0e0e16; --text-soft:#3a3a4a; --text-mute:#6c6c7e;
    --sh-1:0 1px 2px rgba(20,20,40,.08); --sh-2:0 8px 24px rgba(20,20,40,.10); --sh-3:0 22px 60px rgba(20,20,40,.18);
  }
}

/* accent palettes */
[data-accent="violet"]{--accent:#8b5cf6;--accent-2:#6366f1;--accent-3:#a78bfa;--accent-soft:rgba(139,92,246,.14);--accent-contrast:#fff}
[data-accent="emerald"]{--accent:#10b981;--accent-2:#059669;--accent-3:#34d399;--accent-soft:rgba(16,185,129,.14);--accent-contrast:#04130d}
[data-accent="sunset"]{--accent:#f97316;--accent-2:#ea580c;--accent-3:#fb923c;--accent-soft:rgba(249,115,22,.14);--accent-contrast:#1a0a00}
[data-accent="rose"]{--accent:#f43f5e;--accent-2:#e11d48;--accent-3:#fb7185;--accent-soft:rgba(244,63,94,.14);--accent-contrast:#fff}
[data-accent="cyan"]{--accent:#06b6d4;--accent-2:#0891b2;--accent-3:#22d3ee;--accent-soft:rgba(6,182,212,.14);--accent-contrast:#00171c}
[data-accent="gold"]{--accent:#eab308;--accent-2:#ca8a04;--accent-3:#fde047;--accent-soft:rgba(234,179,8,.14);--accent-contrast:#1a1500}
[data-accent="matrix"]{--accent:#22c55e;--accent-2:#16a34a;--accent-3:#4ade80;--accent-soft:rgba(34,197,94,.14);--accent-contrast:#001a00}
[data-accent="magma"]{--accent:#ef4444;--accent-2:#dc2626;--accent-3:#f87171;--accent-soft:rgba(239,68,68,.14);--accent-contrast:#fff}

/* transparent (rgba(0,0,0,0)) variant — translucency mode */
[data-accent="ghost"]{
  --bg:rgba(0,0,0,0); --bg-soft:rgba(255,255,255,.04); --surface:rgba(255,255,255,.06); --surface-2:rgba(255,255,255,.09); --surface-3:rgba(255,255,255,.13);
  --border:rgba(255,255,255,.12); --border-2:rgba(255,255,255,.2);
  --text:#fff; --text-soft:rgba(255,255,255,.85); --text-mute:rgba(255,255,255,.6);
  --accent:#a78bfa; --accent-2:#8b5cf6; --accent-3:#c4b5fd; --accent-soft:rgba(167,139,250,.18); --accent-contrast:#fff;
}

/* ---------- 1. Base typography & body ---------- */
body{
  font-family:var(--font); font-size:var(--fs-md); line-height:var(--lh);
  background:var(--bg); color:var(--text);
  min-height:100vh; min-height:100dvh;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
  transition:background var(--tr),color var(--tr);
}
body.with-wallpaper{
  background-image:var(--wallpaper,none); background-size:cover; background-position:center; background-attachment:fixed;
}
body.with-wallpaper::before{content:"";position:fixed;inset:0;background:var(--bg);opacity:var(--wallpaper-dim,.55);z-index:-1;backdrop-filter:blur(0)}
[data-accent="ghost"] body,body[data-bg="glass"]{backdrop-filter:blur(18px) saturate(1.3)}

/* selectable text disabling on UI chrome */
.no-select{user-select:none;-webkit-user-select:none}

/* scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-mute)}

/* ---------- 2. App layout shell ---------- */
#app{min-height:100vh;min-height:100dvh;display:block}
.screen{display:none}
.screen.active{display:block;animation:fadeIn var(--tr) both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 3. Landing ---------- */
.landing{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:0;
  background:radial-gradient(1200px 600px at 80% -10%, var(--accent-soft), transparent 60%),
             radial-gradient(900px 500px at 0% 110%, var(--accent-soft), transparent 60%),
             var(--bg);
}
.landing__left{padding:clamp(28px,6vw,72px);display:flex;flex-direction:column;gap:26px}
.landing__brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-contrast);font-weight:800;font-size:22px;
  box-shadow:0 8px 26px var(--accent-soft);position:relative;overflow:hidden}
.brand-mark::after{content:"";position:absolute;inset:0;background:radial-gradient(40% 60% at 30% 30%, rgba(255,255,255,.35), transparent 60%)}
.brand-name{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.02em}
.brand-name span{color:var(--accent)}
.landing__title{font-size:clamp(34px,5.4vw,68px);line-height:1.04;letter-spacing:-.03em;font-weight:800}
.landing__title em{font-style:normal;color:var(--accent);background:linear-gradient(135deg,var(--accent),var(--accent-3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.landing__sub{font-size:var(--fs-lg);color:var(--text-soft);max-width:60ch}
.landing__cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
.landing__right{position:relative;display:grid;place-items:center;padding:24px;min-height:100vh;overflow:hidden}
.landing__art{position:relative;width:min(420px,80%);aspect-ratio:1;border-radius:var(--r-xl);overflow:hidden;
  background:linear-gradient(135deg,var(--accent-soft),transparent 60%),var(--surface);
  border:1px solid var(--border);box-shadow:var(--sh-3)}
.landing__art::before,.landing__art::after{content:"";position:absolute;border-radius:50%;filter:blur(40px);opacity:.7}
.landing__art::before{width:60%;height:60%;background:var(--accent);top:-10%;right:-10%;animation:float 8s ease-in-out infinite}
.landing__art::after{width:50%;height:50%;background:var(--accent-3);bottom:-10%;left:-10%;animation:float 10s ease-in-out infinite reverse}
.landing__art-inner{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;z-index:2}
.landing__art-inner b{font-size:var(--fs-3xl);font-weight:800}
.landing__art-inner p{color:var(--text-soft);margin-top:8px}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-14px)}}

.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:10px}
.feature-grid div{padding:14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--border)}
.feature-grid b{font-size:var(--fs-sm);color:var(--accent)}
.feature-grid span{display:block;font-size:var(--fs-sm);color:var(--text-soft);margin-top:4px}

/* ---------- 4. Buttons / inputs / chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:var(--r-md);font-weight:600;font-size:var(--fs-md);cursor:pointer;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  transition:transform var(--tr-fast),background var(--tr-fast),border-color var(--tr-fast),box-shadow var(--tr-fast);
  -webkit-tap-highlight-color:transparent;user-select:none;white-space:nowrap
}
.btn:hover{background:var(--surface-3);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn--primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-contrast);border-color:transparent;box-shadow:0 6px 18px var(--accent-soft)}
.btn--primary:hover{filter:brightness(1.08)}
.btn--ghost{background:transparent}
.btn--ghost:hover{background:var(--surface-2)}
.btn--danger{background:var(--danger);color:#fff;border-color:transparent}
.btn--sm{padding:7px 12px;font-size:var(--fs-sm)}
.btn--lg{padding:14px 26px;font-size:var(--fs-lg)}
.btn--icon{padding:10px;border-radius:var(--r-md);aspect-ratio:1}
.btn--block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn--fab{position:fixed;right:18px;bottom:80px;width:56px;height:56px;border-radius:50%;padding:0;z-index:30;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-contrast);box-shadow:var(--sh-2)}

.input,.textarea,.select{width:100%;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-size:var(--fs-md);transition:border-color var(--tr-fast),background var(--tr-fast)}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);background:var(--surface-2);box-shadow:0 0 0 3px var(--accent-soft)}
.textarea{resize:vertical;min-height:90px;line-height:var(--lh)}
.input-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.input-group label{font-size:var(--fs-sm);color:var(--text-soft);font-weight:600}
.input-group .hint{font-size:var(--fs-xs);color:var(--text-mute)}
.input-group.error .input,.input-group.error .textarea{border-color:var(--danger)}
.input-group.error label{color:var(--danger)}
.field-row{display:flex;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:var(--fs-sm);cursor:pointer;transition:all var(--tr-fast)}
.chip:hover{background:var(--surface-3)}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.toggle{position:relative;width:42px;height:24px;border-radius:999px;background:var(--surface-3);cursor:pointer;transition:background var(--tr-fast);flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform var(--tr)}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(18px)}

/* ---------- 5. Auth screen ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(800px 400px at 50% -10%, var(--accent-soft), transparent 60%),var(--bg)}
.auth__card{width:min(440px,100%);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:30px;box-shadow:var(--sh-2)}
.auth__head{text-align:center;margin-bottom:22px}
.auth__head .brand-mark{margin:0 auto 12px}
.auth__head h1{font-size:var(--fs-2xl);font-weight:800}
.auth__head p{color:var(--text-soft);font-size:var(--fs-sm);margin-top:4px}
.auth__switch{text-align:center;font-size:var(--fs-sm);color:var(--text-soft);margin-top:14px}
.auth__switch a{color:var(--accent);cursor:pointer;font-weight:600}

/* ---------- 6. Main app shell ---------- */
.shell{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr) var(--rail-w);min-height:100vh;min-height:100dvh}
.shell.no-rail{grid-template-columns:var(--nav-w) minmax(0,1fr)}
.nav{position:sticky;top:0;height:100vh;height:100dvh;padding:18px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--border);background:var(--bg-soft);overflow-y:auto}
.nav__brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.nav__brand .brand-mark{width:34px;height:34px;border-radius:10px;font-size:16px}
.nav__brand b{font-size:var(--fs-lg);font-weight:800;letter-spacing:-.02em}
.nav__brand b span{color:var(--accent)}
.nav__item{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:var(--r-md);cursor:pointer;font-weight:600;color:var(--text-soft);transition:all var(--tr-fast);position:relative}
.nav__item:hover{background:var(--surface-2);color:var(--text)}
.nav__item.active{background:var(--accent-soft);color:var(--accent)}
.nav__item svg{width:22px;height:22px;flex:none}
.nav__item .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:var(--fs-xs);padding:1px 7px;border-radius:999px;font-weight:700}
.nav__spacer{margin-top:auto}
.main{padding:14px clamp(10px,2vw,24px) 80px;max-width:820px;margin:0 auto;width:100%}
.main--wide{max-width:none}
.rail{position:sticky;top:0;height:100vh;height:100dvh;padding:18px 14px;border-left:1px solid var(--border);background:var(--bg-soft);overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.rail__card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.rail__card h3{font-size:var(--fs-md);font-weight:700;margin-bottom:10px}
.rail__card .link{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;border-radius:var(--r-sm);cursor:pointer;font-size:var(--fs-sm)}
.rail__card .link:hover{background:var(--surface-2)}
.rail__card .link small{color:var(--text-mute)}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px}
.topbar h2{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.02em;flex:none}
.topbar .search{flex:1;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border)}
.topbar .search input{flex:1;background:none;border:none;outline:none;font-size:var(--fs-sm)}
.topbar .search svg{width:18px;height:18px;color:var(--text-mute)}
.topbar__actions{display:flex;gap:6px;align-items:center;margin-left:auto}

/* mobile bottom nav */
.mobilenav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--border);padding:6px env(safe-area-inset-right,8px) calc(6px + env(safe-area-inset-bottom,8px)) env(safe-area-inset-left,8px)}
.mobilenav__items{display:flex;justify-content:space-around}
.mobilenav__item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;color:var(--text-mute);font-size:var(--fs-xs);font-weight:600;cursor:pointer}
.mobilenav__item svg{width:22px;height:22px}
.mobilenav__item.active{color:var(--accent)}

/* ---------- 7. Composer ---------- */
.composer{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:14px}
.composer__top{display:flex;gap:10px;align-items:flex-start}
.composer__avatar{width:42px;height:42px;border-radius:50%;background:var(--surface-3);overflow:hidden;flex:none;display:grid;place-items:center;font-weight:700;color:var(--accent)}
.composer__avatar img,.composer__avatar video{width:100%;height:100%;object-fit:cover}
.composer__body{flex:1;display:flex;flex-direction:column;gap:10px}
.composer__textarea{width:100%;min-height:60px;background:none;border:none;resize:none;font-size:var(--fs-md);color:var(--text);font-family:inherit}
.composer__textarea::placeholder{color:var(--text-mute)}
.composer__media-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:4px}
.composer__media-preview .media-item{position:relative;aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-3)}
.composer__media-preview .media-item img,.composer__media-preview .media-item video{width:100%;height:100%;object-fit:cover}
.composer__media-preview .media-item .remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:14px;line-height:1}
.composer__media-preview .file-chip{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-2);border-radius:var(--r-sm);font-size:var(--fs-sm)}
.composer__bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--border);margin-top:6px}
.composer__bar .iconbtn{width:36px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;cursor:pointer;color:var(--text-soft);transition:all var(--tr-fast)}
.composer__bar .iconbtn:hover{background:var(--surface-2);color:var(--accent)}
.composer__bar .iconbtn svg{width:20px;height:20px}
.composer__bar .spacer{margin-left:auto;display:flex;gap:8px;align-items:center}
.composer__counter{font-size:var(--fs-xs);color:var(--text-mute);font-variant-numeric:tabular-nums}
.composer__counter.warn{color:var(--warning)}
.composer__counter.danger{color:var(--danger)}

/* ---------- 8. Posts / feed ---------- */
.feed{display:flex;flex-direction:column;gap:14px}
.post{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:border-color var(--tr-fast),box-shadow var(--tr-fast)}
.post:hover{border-color:var(--border-2)}
.post__head{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.post__avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--surface-3);flex:none;display:grid;place-items:center;font-weight:700;color:var(--accent)}
.post__avatar img,.post__avatar video{width:100%;height:100%;object-fit:cover}
.post__meta{flex:1;min-width:0}
.post__meta b{font-size:var(--fs-md);font-weight:700;display:block}
.post__meta .sub{font-size:var(--fs-xs);color:var(--text-mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.post__meta .sub .priv{display:inline-flex;align-items:center;gap:3px}
.post__meta .sub .priv svg{width:11px;height:11px}
.post__more{margin-left:auto;padding:6px;border-radius:var(--r-sm);cursor:pointer;color:var(--text-mute)}
.post__more:hover{background:var(--surface-2);color:var(--text)}
.post__content{padding:0 14px 8px;font-size:var(--fs-md);white-space:pre-wrap;word-break:break-word;color:var(--text)}
.post__content.hidden-by-spoiler{position:relative}
.post__content .spoiler-veil{position:absolute;inset:0;background:var(--surface-3);border-radius:var(--r-sm);display:grid;place-items:center;cursor:pointer;font-size:var(--fs-sm);color:var(--text-soft)}
.post__media{display:grid;gap:2px;margin:6px 0}
.post__media.layout-1{grid-template-columns:1fr}
.post__media.layout-2{grid-template-columns:1fr 1fr}
.post__media.layout-3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.post__media.layout-3>*:first-child{grid-row:1/3}
.post__media.layout-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.post__media .m{overflow:hidden;background:var(--surface-3);position:relative}
.post__media .m img,.post__media .m video{width:100%;height:100%;object-fit:cover;min-height:160px}
.post__media .m.file{display:flex;align-items:center;gap:10px;padding:12px;font-size:var(--fs-sm)}
.post__media .m.file svg{width:24px;height:24px;color:var(--accent)}
.post__media .m .play-overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.25);color:#fff;pointer-events:none}
.post__media .m .play-overlay svg{width:48px;height:48px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.post__actions{display:flex;align-items:center;gap:2px;padding:6px 8px;border-top:1px solid var(--border)}
.post__action{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--text-soft);font-size:var(--fs-sm);font-weight:600;transition:all var(--tr-fast);flex:1;justify-content:center}
.post__action:hover{background:var(--surface-2);color:var(--accent)}
.post__action svg{width:18px;height:18px}
.post__action.liked{color:var(--danger)}
.post__action.liked svg{fill:var(--danger)}
.post__action.saved{color:var(--success)}
.post__action .count{font-variant-numeric:tabular-nums}
.post__comments{padding:0 14px 12px;display:none}
.post__comments.open{display:block}
.comment{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--border)}
.comment__avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700;color:var(--accent);flex:none}
.comment__avatar img,.comment__avatar video{width:100%;height:100%;object-fit:cover;border-radius:50%}
.comment__body{flex:1;min-width:0}
.comment__body b{font-size:var(--fs-sm);font-weight:700}
.comment__body .time{font-size:var(--fs-xs);color:var(--text-mute);margin-left:6px}
.comment__body p{font-size:var(--fs-sm);margin-top:2px;color:var(--text)}
.comment__actions{display:flex;gap:10px;margin-top:4px;font-size:var(--fs-xs);color:var(--text-mute)}
.comment__actions span{cursor:pointer}
.comment__actions span:hover{color:var(--accent)}
.comment-composer{display:flex;gap:8px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.comment-composer input{flex:1;background:var(--surface-2);padding:8px 12px;border-radius:999px;font-size:var(--fs-sm);border:1px solid var(--border)}
.comment-composer input:focus{border-color:var(--accent)}

/* ---------- 9. Profile ---------- */
.profile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px}
.profile__banner{position:relative;height:clamp(140px,22vw,220px);background:linear-gradient(135deg,var(--accent-soft),var(--surface-3));overflow:hidden}
.profile__banner img,.profile__banner video{width:100%;height:100%;object-fit:cover}
.profile__banner-edit{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.55);color:#fff;padding:6px 12px;border-radius:999px;font-size:var(--fs-sm);cursor:pointer;display:flex;align-items:center;gap:6px}
.profile__head{padding:0 18px 16px;position:relative}
.profile__avatar-wrap{position:relative;width:96px;height:96px;margin-top:-48px}
.profile__avatar{width:96px;height:96px;border-radius:50%;background:var(--surface);border:4px solid var(--surface);overflow:hidden;display:grid;place-items:center;font-size:34px;font-weight:800;color:var(--accent)}
.profile__avatar img,.profile__avatar video{width:100%;height:100%;object-fit:cover}
.profile__row{display:flex;justify-content:space-between;align-items:flex-start;margin-top:10px;flex-wrap:wrap;gap:8px}
.profile__name{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.02em}
.profile__handle{color:var(--text-mute);font-size:var(--fs-sm)}
.profile__bio{margin-top:10px;color:var(--text-soft);font-size:var(--fs-md);white-space:pre-wrap}
.profile__meta{display:flex;gap:18px;margin-top:12px;font-size:var(--fs-sm);color:var(--text-soft);flex-wrap:wrap}
.profile__meta b{color:var(--text);font-weight:700}
.profile__cta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.profile__tabs{display:flex;border-top:1px solid var(--border)}
.profile__tab{flex:1;padding:12px;text-align:center;font-size:var(--fs-sm);font-weight:600;color:var(--text-mute);cursor:pointer;border-bottom:2px solid transparent}
.profile__tab.active{color:var(--accent);border-color:var(--accent)}
.profile__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:2px;padding:2px}
.profile__grid .g{position:relative;aspect-ratio:1;overflow:hidden;background:var(--surface-3);cursor:pointer}
.profile__grid .g img,.profile__grid .g video{width:100%;height:100%;object-fit:cover}
.profile__grid .g .text-tile{padding:10px;font-size:var(--fs-xs);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- 10. Chat ---------- */
.chat{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 50px);height:calc(100dvh - 50px);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.chat__list{border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-soft)}
.chat__list-head{padding:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.chat__list-head input{flex:1;background:var(--surface);padding:8px 12px;border-radius:999px;border:1px solid var(--border);font-size:var(--fs-sm)}
.chat__conv{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.chat__conv:hover{background:var(--surface-2)}
.chat__conv.active{background:var(--accent-soft)}
.chat__conv-av{width:42px;height:42px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-weight:700;color:var(--accent);flex:none}
.chat__conv-av img,.chat__conv-av video{width:100%;height:100%;object-fit:cover;border-radius:50%}
.chat__conv-meta{flex:1;min-width:0}
.chat__conv-meta b{font-size:var(--fs-sm);font-weight:700;display:block}
.chat__conv-meta p{font-size:var(--fs-xs);color:var(--text-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat__conv-time{font-size:var(--fs-xs);color:var(--text-mute)}
.chat__thread{display:flex;flex-direction:column}
.chat__thread-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg-soft)}
.chat__thread-head b{font-weight:700;font-size:var(--fs-md)}
.chat__thread-head small{color:var(--text-mute);font-size:var(--fs-xs)}
.chat__messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:70%;padding:8px 12px;border-radius:var(--r-md);font-size:var(--fs-sm);white-space:pre-wrap;word-break:break-word;line-height:1.4}
.msg.in{background:var(--surface-2);border-bottom-left-radius:4px;align-self:flex-start}
.msg.out{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-contrast);border-bottom-right-radius:4px;align-self:flex-end}
.msg .time{display:block;font-size:10px;opacity:.6;margin-top:2px;text-align:right}
.msg.media img,.msg.media video{max-width:240px;border-radius:var(--r-sm);margin-bottom:4px;display:block}
.chat__composer{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;background:var(--bg-soft)}
.chat__composer input{flex:1;background:var(--surface);padding:10px 14px;border-radius:999px;border:1px solid var(--border);font-size:var(--fs-sm)}
.chat__composer input:focus{border-color:var(--accent)}

/* ---------- 11. Search ---------- */
.search-results{display:flex;flex-direction:column;gap:14px}
.search-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.search-cat{padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)}
.search-cat h4{font-size:var(--fs-sm);font-weight:700;margin-bottom:6px;color:var(--accent)}
.search-cat .chip{margin:2px}

/* ---------- 12. Settings ---------- */
.settings{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.settings__tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--border);overflow-x:auto}
.settings__tab{padding:12px 18px;font-size:var(--fs-sm);font-weight:600;color:var(--text-mute);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.settings__tab.active{color:var(--accent);border-color:var(--accent)}
.settings__pane{padding:18px}
.settings__group{margin-bottom:22px}
.settings__group h3{font-size:var(--fs-md);font-weight:700;margin-bottom:10px}
.settings__row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);gap:14px}
.settings__row:last-child{border:none}
.settings__row .meta{flex:1}
.settings__row .meta b{font-size:var(--fs-sm);font-weight:600}
.settings__row .meta small{display:block;color:var(--text-mute);font-size:var(--fs-xs);margin-top:2px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform var(--tr-fast)}
.swatch:hover{transform:scale(1.12)}
.swatch.active{border-color:var(--text)}

/* ---------- 13. Discover (video) ---------- */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.video-card{position:relative;aspect-ratio:9/16;border-radius:var(--r-md);overflow:hidden;background:var(--surface-3);cursor:pointer}
.video-card img,.video-card video{width:100%;height:100%;object-fit:cover}
.video-card .ov{position:absolute;left:0;right:0;bottom:0;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff}
.video-card .ov b{font-size:var(--fs-sm);font-weight:700;display:block}
.video-card .ov span{font-size:var(--fs-xs);opacity:.8}
.video-modal{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:80;display:none;align-items:center;justify-content:center;padding:14px}
.video-modal.open{display:flex}
.video-modal .vm-inner{position:relative;max-width:460px;width:100%;aspect-ratio:9/16;background:#000;border-radius:var(--r-md);overflow:hidden}
.video-modal video{width:100%;height:100%;object-fit:cover}
.video-modal .close{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.55);color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;z-index:5}
.video-modal .vm-meta{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff}

/* ---------- 14. Modals / overlays ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(8px)}
.modal.open{display:flex;animation:fadeIn var(--tr) both}
.modal__card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);width:min(540px,100%);max-height:88vh;overflow-y:auto;padding:22px;box-shadow:var(--sh-3)}
.modal__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal__head h3{font-size:var(--fs-xl);font-weight:800}
.modal__close{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--text-mute)}
.modal__close:hover{background:var(--surface-2);color:var(--text)}
.menu{position:fixed;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-md);padding:6px;min-width:180px;box-shadow:var(--sh-2);z-index:60;display:none}
.menu.open{display:block}
.menu .item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:var(--fs-sm);color:var(--text)}
.menu .item:hover{background:var(--surface-2)}
.menu .item.danger{color:var(--danger)}
.menu .item svg{width:16px;height:16px}

/* ---------- 15. Toasts ---------- */
.toasts{position:fixed;top:14px;right:14px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:340px;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-md);padding:10px 14px;font-size:var(--fs-sm);box-shadow:var(--sh-2);display:flex;align-items:center;gap:8px;animation:slideIn var(--tr) both;pointer-events:auto;border-left:3px solid var(--accent)}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}
.toast .x{margin-left:auto;cursor:pointer;color:var(--text-mute)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

/* ---------- 16. Avatar orb / loader ---------- */
.loader{width:24px;height:24px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-mute)}
.empty-state svg{width:48px;height:48px;margin:0 auto 10px;opacity:.5}
.empty-state b{display:block;font-size:var(--fs-md);color:var(--text-soft);margin-bottom:4px}
.empty-state p{font-size:var(--fs-sm)}

/* ---------- 17. Live counter ticker ---------- */
.ticker{position:fixed;left:14px;bottom:14px;z-index:40;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:var(--fs-xs);color:var(--text-soft);display:flex;align-items:center;gap:6px;box-shadow:var(--sh-1)}
.ticker .dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ---------- 18. Responsive ---------- */
@media (max-width:1100px){
  :root{--nav-w:72px}
  .nav__brand b,.nav__item span:not(.badge){display:none}
  .nav__item{justify-content:center;padding:11px;border-radius:var(--r-md)}
  .nav__item .badge{position:absolute;top:4px;right:4px;margin:0}
  .rail{display:none}
  .shell,.shell.no-rail{grid-template-columns:var(--nav-w) minmax(0,1fr)}
}
@media (max-width:760px){
  :root{--nav-w:0px}
  .nav{display:none}
  .shell,.shell.no-rail{grid-template-columns:1fr}
  .main{padding:8px 10px 96px}
  .landing{grid-template-columns:1fr}
  .landing__right{display:none}
  .mobilenav{display:block}
  .topbar h2{font-size:var(--fs-lg)}
  .topbar .search{display:none}
  .topbar.search-open .search{display:flex;position:absolute;left:0;right:0;top:0;bottom:0;border-radius:0;padding:8px 12px;z-index:5}
  .topbar.search-open h2,.topbar.search-open .topbar__actions{display:none}
  .chat{grid-template-columns:1fr;height:calc(100dvh - 110px)}
  .chat__list{display:none}
  .chat.list-open .chat__list{display:flex;position:absolute;inset:0;z-index:5;background:var(--bg)}
  .ticker{display:none}
  .post__action .count{display:none}
  .post__action{padding:8px}
  .composer__bar .iconbtn{width:32px;height:32px}
  .btn--fab{display:flex}
  .profile__avatar-wrap{width:80px;height:80px;margin-top:-40px}
  .profile__avatar{width:80px;height:80px;font-size:28px}
  .video-grid{grid-template-columns:repeat(2,1fr);gap:6px}
}
@media (max-width:420px){
  .landing__left{padding:24px}
  .post__action:nth-child(3){display:none}
  .profile__meta{gap:10px;font-size:var(--fs-xs)}
}

/* print */
@media print{.nav,.rail,.mobilenav,.ticker,.btn--fab{display:none}}

/* utility */
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.center{display:grid;place-items:center;min-height:60vh}
.muted{color:var(--text-mute)}
.accent{color:var(--accent)}
.right{text-align:right}
.nowrap{white-space:nowrap}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.between{display:flex;justify-content:space-between;align-items:center}
.mb-0{margin-bottom:0}.mb-sm{margin-bottom:8px}.mb-md{margin-bottom:14px}.mb-lg{margin-bottom:22px}
.mt-sm{margin-top:8px}.mt-md{margin-top:14px}.mt-lg{margin-top:22px}
.tiny{font-size:var(--fs-xs)}.small{font-size:var(--fs-sm)}.big{font-size:var(--fs-xl)}.huge{font-size:var(--fs-2xl)}
.bold{font-weight:700}.italic{font-style:italic}
.clamp-1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.divider{height:1px;background:var(--border);margin:14px 0}
.skeleton{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:var(--r-sm)}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
</style>

<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<div class="ticker" id="ticker"><span class="dot"></span><span id="ticker-text">0 explorers online</span></div>
<button class="btn btn--fab no-select" id="fab" title="Compose" aria-label="Compose">＋</button>

<script>
/* ============================================================
   ORPHAN KNOWLEDGE — application script
   All state is browser-local (IndexedDB + localStorage).
   Cross-tab sync via BroadcastChannel("orphan-knowledge").
   No backend. No external API keys.
   ============================================================ */
"use strict";
(function(){
/* ---------- 0. Tiny utilities ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=(tag,props={},kids=[])=>{const e=document.createElement(tag);for(const k in props){if(k==="class")e.className=props[k];else if(k==="dataset")Object.assign(e.dataset,props[k]);else if(k==="html")e.innerHTML=props[k];else if(k==="text")e.textContent=props[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),props[k]);else if(k==="attrs"){for(const a in props[k])e.setAttribute(a,props[k][a])}else e[k]=props[k]}(kids||[]).forEach(c=>{if(c==null)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e};
const uid=()=>"id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);
const uuid=()=>([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
const fmtDate=d=>{const dt=typeof d==="number"?new Date(d):d;const now=Date.now();const diff=(now-dt.getTime())/1000;if(diff<60)return"just now";if(diff<3600)return Math.floor(diff/60)+"m";if(diff<86400)return Math.floor(diff/3600)+"h";if(diff<604800)return Math.floor(diff/86400)+"d";return dt.toLocaleDateString()};
const fmtBytes=b=>{if(!b)return"0 B";const u=["B","KB","MB","GB","TB"];const i=Math.floor(Math.log(b)/Math.log(1024));return(b/Math.pow(1024,i)).toFixed(i?1:0)+" "+u[i]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const debounce=(fn,ms=200)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const fmtCount=n=>{if(n<1000)return""+n;if(n<1e6)return(n/1e3).toFixed(n<1e4?1:0)+"K";if(n<1e9)return(n/1e6).toFixed(1)+"M";return(n/1e9).toFixed(1)+"B"};
const hashStr=s=>{let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0}return Math.abs(h)};
const colorFrom=str=>{const h=hashStr(str)%360;return`hsl(${h} 65% 55%)`};

/* ---------- 2. Storage (IndexedDB + localStorage) ---------- */
const DB_NAME="orphan-knowledge";const DB_VER=3;
let _db=null;
function db(){return new Promise((res,rej)=>{if(_db)return res(_db);const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=e=>{const d=e.target.result;["media"].forEach(name=>{if(!d.objectStoreNames.contains(name))d.createObjectStore(name,{keyPath:"id"})})};r.onsuccess=e=>{res(e.target.result)};r.onerror=e=>rej(e.target.error)})}
/* STORE_MAP: maps IndexedDB store names to state property names */
const STORE_MAP={users:"users",posts:"posts",comments:"comments",messages:"messages",conversations:"conversations",communities:"communities",bookmarks:"bookmarks",notifications:"notifications",drafts:"drafts",scheduled:"scheduled",follows:"follows",blocks:"blocks",mutes:"mutes",reactions:"reactions",polls:"polls",votes:"votes",audit:"audit",tickets:"helpTickets",announcements:"announcements",sessions:"sessions",bans:"bans",friendRequests:"friendRequests",messageReactions:"messageReactions",pinnedMessages:"pinnedMessages",voiceMessages:"voiceMessages",settings:"_kvSettings",stats:"_kvStats",presence:"_kvPresence"};
let _suppressCloud=false;
/* ONLINE storage: in-memory state + ntfy.sh cloud (IndexedDB only for media blobs) */
async function put(store,obj){if(store==="media"){try{const d=await db();return await new Promise((res,rej)=>{const tx=d.transaction(store,"readwrite");tx.objectStore(store).put(obj);tx.oncomplete=()=>res(obj);tx.onerror=()=>rej(tx.error)})}catch(e){console.error("[media] put error:",e);return obj}}const sk=STORE_MAP[store];if(!sk){if(store==="settings"){if(!state._kvSettings)state._kvSettings={};state._kvSettings[obj.id]=obj;if(!_suppressCloud)scheduleCloudSync();return obj}if(store==="stats"){state._kvStats=obj;if(!_suppressCloud)scheduleCloudSync();return obj}if(store==="presence"){if(!state._kvPresence)state._kvPresence={};state._kvPresence[obj.id]=obj;return obj}return obj}if(!state[sk])state[sk]=[];const i=state[sk].findIndex(x=>x.id===obj.id);if(i>=0)state[sk][i]=obj;else state[sk].push(obj);if(!_suppressCloud)scheduleCloudSync();return obj}
async function bulkPut(store,arr){for(const o of arr){await put(store,o)}return arr}
async function get(store,id){if(store==="media"){try{const d=await db();return await new Promise((res,rej)=>{const tx=d.transaction(store,"readonly");const r=tx.objectStore(store).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return undefined}}if(store==="settings")return state._kvSettings?.[id];if(store==="stats")return state._kvStats;if(store==="presence")return state._kvPresence?.[id];const sk=STORE_MAP[store];if(!sk||!state[sk])return undefined;return state[sk].find(x=>x.id===id)}
async function getAll(store){if(store==="media"){try{const d=await db();return await new Promise((res,rej)=>{const tx=d.transaction(store,"readonly");const r=tx.objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}catch(e){return[]}}if(store==="settings")return Object.values(state._kvSettings||{});if(store==="stats")return state._kvStats?[state._kvStats]:[];const sk=STORE_MAP[store];if(!sk)return[];return state[sk]||[]}
async function del(store,id){if(store==="media"){try{const d=await db();return await new Promise((res,rej)=>{const tx=d.transaction(store,"readwrite");tx.objectStore(store).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}catch(e){return}}if(store==="settings"){if(state._kvSettings)delete state._kvSettings[id];if(!_suppressCloud)scheduleCloudSync();return}if(store==="stats"){state._kvStats=null;if(!_suppressCloud)scheduleCloudSync();return}const sk=STORE_MAP[store];if(sk&&state[sk]){state[sk]=state[sk].filter(x=>x.id!==id);if(!_suppressCloud)scheduleCloudSync()}}
async function clear(store){if(store==="media"){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(store,"readwrite");tx.objectStore(store).clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}if(store==="settings"){state._kvSettings={};if(!_suppressCloud)scheduleCloudSync();return}if(store==="stats"){state._kvStats=null;if(!_suppressCloud)scheduleCloudSync();return}const sk=STORE_MAP[store];if(sk){state[sk]=[];if(!_suppressCloud)scheduleCloudSync()}}

/* ---------- 2a. Cloud Public API (ntfy.sh — free, no API key, no signup, CORS-enabled) ---------- */
const CLOUD_TOPIC="ok-cloud-db-v1";
let cloudWriteTimer=null;
let cloudEnabled=true;
let cloudStats={synced:0,fetches:0,writes:0,errors:0,lastSync:0};
const CLOUD_TABLES=["users","posts","comments","messages","conversations","communities","bookmarks","notifications","drafts","scheduled","reactions","follows","blocks","mutes","polls","votes","audit","tickets","announcements","sessions","bans","friendRequests","messageReactions","pinnedMessages","voiceMessages","presence","stats","settings"];

async function cloudInit(){
  cloudEnabled=true;
  console.log("[cloud] using ntfy.sh topic:",CLOUD_TOPIC);
  return CLOUD_TOPIC;
}
async function cloudFetchAll(){
  try{
    cloudStats.fetches++;
    const res=await fetch(NTFY_BASE+"/"+CLOUD_TOPIC+"/json?poll=1&since=12h");
    if(!res.ok)return null;
    const text=await res.text();
    const lines=text.split("\n").filter(l=>l.trim());
    let latestData=null;
    for(const line of lines){
      try{
        const env=JSON.parse(line);
        if(env.event==="message"&&env.message){
          try{const parsed=JSON.parse(env.message);if(parsed&&typeof parsed==="object"){latestData=parsed}}catch(e){}
        }
      }catch(e){}
    }
    cloudStats.lastSync=Date.now();
    if(latestData){console.log("[cloud] fetched latest snapshot from ntfy.sh")}
    return latestData;
  }catch(e){console.error("[cloud] fetch failed:",e);cloudStats.errors++;return null}
}
function scheduleCloudSync(){if(!cloudEnabled)return;if(cloudWriteTimer)clearTimeout(cloudWriteTimer);cloudWriteTimer=setTimeout(cloudWriteNow,5000)}
async function cloudWriteNow(){
  if(!cloudEnabled)return;
  try{
    const dbData={};
    for(const table of CLOUD_TABLES){
      try{const records=await getAll(table);dbData[table]=records}catch(e){dbData[table]=[]}
    }
    if(dbData.users){dbData.users=dbData.users.map(u=>{const s={...u};delete s.activeSessionId;return s})}
    if(dbData.sessions){dbData.sessions=dbData.sessions.map(s=>{const ss={...s};delete ss.token;return ss})}
    let body=JSON.stringify(dbData);
    if(body.length>500000){
      console.warn("[cloud] data too large ("+Math.round(body.length/1024)+"KB) — trimming for ntfy.sh 512KB limit");
      if(dbData.audit&&dbData.audit.length>100)dbData.audit=dbData.audit.slice(0,100);
      if(dbData.messages&&dbData.messages.length>300)dbData.messages=dbData.messages.slice(-300);
      if(dbData.posts&&dbData.posts.length>200)dbData.posts=dbData.posts.slice(0,200);
      if(dbData.notifications&&dbData.notifications.length>50)dbData.notifications=dbData.notifications.slice(0,50);
      delete dbData.presence;
      body=JSON.stringify(dbData);
    }
    const res=await fetch(NTFY_BASE+"/"+CLOUD_TOPIC,{method:"POST",body:body,headers:{"Content-Type":"text/plain"}});
    if(res.ok){cloudStats.synced++;cloudStats.writes++;cloudStats.lastSync=Date.now();console.log("[cloud] snapshot published to ntfy.sh ("+Math.round(body.length/1024)+"KB)")}else{console.error("[cloud] write failed:",res.status);cloudStats.errors++}
  }catch(e){console.error("[cloud] write error:",e);cloudStats.errors++}
}
async function cloudMerge(cloudData){if(!cloudData||typeof cloudData!=="object")return 0;_suppressCloud=true;let merged=0;for(const table of Object.keys(cloudData)){if(table==="media")continue;if(!CLOUD_TABLES.includes(table))continue;const records=cloudData[table];if(!Array.isArray(records)){if(table==="settings"&&records&&typeof records==="object"){for(const id of Object.keys(records)){if(!state._kvSettings||!state._kvSettings[id]){await put("settings",records[id]);merged++}}continue}if(table==="stats"&&records&&records.id){if(!state._kvStats){await put("stats",records);merged++}continue}continue}for(const record of records){if(!record||!record.id)continue;try{const existing=await get(table,record.id);if(!existing){await put(table,record);merged++}else if(record.updatedAt&&existing.updatedAt&&record.updatedAt>existing.updatedAt){await put(table,record);merged++}else if(record.ts&&existing.ts&&record.ts>existing.ts){await put(table,record);merged++}else if(record.createdAt&&existing.createdAt&&record.createdAt>existing.createdAt&&!record.updatedAt&&!existing.updatedAt){await put(table,record);merged++}}catch(e){}}}_suppressCloud=false;return merged}
async function cloudFullSync(){
  console.log("[cloud] starting full sync...");
  const cloudData=await cloudFetchAll();
  if(!cloudData){console.log("[cloud] no data in cloud yet");return}
  const merged=await cloudMerge(cloudData);
  console.log("[cloud] merged",merged,"records from cloud");
  await cloudWriteNow();
  return merged

/* ---------- 27l. Global Live Sync via ntfy.sh (free, no API key, no signup, worldwide) ---------- */
const NTFY_BASE="https://ntfy.sh";
const NTFY_WS_BASE="wss://ntfy.sh";
const SYNC_APP_NS="ok";
const SYNC_VERSION="v1";
const PUBLIC_TOPIC=SYNC_APP_NS+"-public-"+SYNC_VERSION;
const syncSockets={};
let syncEnabled=false;
let syncStats={topics:0,messagesReceived:0,messagesSent:0,lastMessageAt:0,connected:false};
function getInboxTopic(user){if(!user||!user.syncSecret)return null;return SYNC_APP_NS+"-inbox-"+user.syncSecret}
function startGlobalSync(){if(!state.user||!state.user.syncSecret){console.warn("[sync] no syncSecret");return false}syncEnabled=true;syncStats={topics:0,messagesReceived:0,messagesSent:0,lastMessageAt:0,connected:false};const topics=[PUBLIC_TOPIC,getInboxTopic(state.user)];topics.forEach(t=>subscribeToSyncTopic(t));toast("🌐 Global sync ON — live updates worldwide","success",4000);return true}
function stopGlobalSync(){syncEnabled=false;Object.values(syncSockets).forEach(ws=>{try{ws.close()}catch(e){}});Object.keys(syncSockets).forEach(k=>delete syncSockets[k]);syncStats.connected=false;syncStats.topics=0;updateSyncStatusUI();toast("Global sync OFF","info")}
function subscribeToSyncTopic(topic){if(!topic)return;if(syncSockets[topic]){try{syncSockets[topic].close()}catch(e){}}try{const ws=new WebSocket(NTFY_WS_BASE+"/"+topic+"/ws");ws.onopen=()=>{console.log("[sync] WS open:",topic);syncStats.connected=true;syncStats.topics++;updateSyncStatusUI();fetchMissedSyncMessages(topic)};ws.onclose=()=>{console.log("[sync] WS close:",topic);delete syncSockets[topic];syncStats.topics=Math.max(0,syncStats.topics-1);syncStats.connected=syncStats.topics>0;updateSyncStatusUI();if(syncEnabled){setTimeout(()=>{if(syncEnabled)subscribeToSyncTopic(topic)},5000)}};ws.onerror=(e)=>{console.error("[sync] WS error:",topic,e)};ws.onmessage=async(e)=>{try{const env=JSON.parse(e.data);if(env.event==="message"&&env.message){let msg;try{msg=JSON.parse(env.message)}catch(e2){msg={type:"raw",data:env.message,from:"unknown"}};await handleSyncMessage(msg);syncStats.messagesReceived++;syncStats.lastMessageAt=Date.now();updateSyncStatusUI()}}catch(err){console.error("[sync] parse err:",err)}};syncSockets[topic]=ws}catch(e){console.error("[sync] subscribe fail:",e);if(syncEnabled)setTimeout(()=>subscribeToSyncTopic(topic),5000)}}
async function fetchMissedSyncMessages(topic){try{const res=await fetch(NTFY_BASE+"/"+topic+"/json?since=12h&poll=1");if(!res.ok)return;const text=await res.text();const lines=text.split("\n").filter(l=>l.trim());for(const line of lines){try{const env=JSON.parse(line);if(env.event==="message"&&env.message){let msg;try{msg=JSON.parse(env.message)}catch(e){msg={type:"raw",data:env.message,from:"unknown"}};await handleSyncMessage(msg);syncStats.messagesReceived++}}catch(e){}}}catch(e){console.warn("[sync] fetch missed failed:",e)}}
async function publishToSync(topic,message){if(!syncEnabled||!topic)return false;try{const body=JSON.stringify(message);await fetch(NTFY_BASE+"/"+topic,{method:"POST",body:body,headers:{"Content-Type":"text/plain"}});syncStats.messagesSent++;updateSyncStatusUI();return true}catch(e){console.error("[sync] publish failed:",e);return false}}
async function handleSyncMessage(msg){if(!msg||!msg.type)return;if(msg.from&&msg.from===state.user?.id)return;const sender=state.users.find(u=>u.id===msg.from);
  if(msg.type==="post"){const p=msg.data;if(!p)return;const existing=state.posts.find(x=>x.id===p.id);if(!existing){state.posts.unshift(p);await put("posts",p);if(state.view==="feed")renderFeedInto($("#main-content"));toast("📨 New post"+(sender?" from "+sender.display:"")+(p.category?" · #"+p.category:""),"info",3000)}}
  else if(msg.type==="message"){const m=msg.data;if(!m)return;if(!state.messages.find(x=>x.id===m.id)){state.messages.push(m);await put("messages",m);const conv=state.conversations.find(c=>c.id===m.convId);if(!conv){conv={id:m.convId,participants:[m.authorId,state.user.id],createdAt:Date.now()};await put("conversations",conv);state.conversations.push(conv)}if(state.view==="chat"&&state.viewArgs.convId===m.convId)renderChatInto($("#main-content"));if(sender)toast("💬 "+sender.display+": "+(m.text||"📎 media").slice(0,60),"info",3000)}}
  else if(msg.type==="user"){const u=msg.data;if(!u)return;const existing=state.users.find(x=>x.id===u.id);const safeUser=Object.assign({},u);delete safeUser.passHash;delete safeUser.activeSessionId;if(!existing){state.users.push(safeUser);await put("users",safeUser);/* Live notification: a brand-new user just joined — visible + searchable worldwide */if(state.user&&u.id!==state.user.id){toast("🎉 New member joined: "+(u.display||"@"+u.username),"success",4000);if(state.view==="people")renderPeopleInto($("#main-content"));if(state.view==="feed")renderFeedInto($("#main-content"))}}else{const merged=Object.assign({},existing,safeUser,{passHash:existing.passHash,activeSessionId:existing.activeSessionId,syncSecret:existing.syncSecret||safeUser.syncSecret});const idx=state.users.indexOf(existing);state.users[idx]=merged;await put("users",merged);/* If friendship status changed (e.g. we got added as a friend), refresh feed so friends-tier posts appear */if(merged.friends&&state.user&&merged.friends.includes(state.user.id)&&state.view==="feed"){renderFeedInto($("#main-content"))}}}
  else if(msg.type==="presence"){const target=state.users.find(x=>x.id===msg.userId);if(target){target.presence=msg.status||"online";target.lastSeen=Date.now()}}
  else if(msg.type==="friend-request"){const fr=msg.data;if(!fr)return;if(!state.friendRequests.find(x=>x.id===fr.id)){state.friendRequests.push(fr);const from=state.users.find(u=>u.id===fr.from);if(from){from.friendRequestsSent=from.friendRequestsSent||[];if(!from.friendRequestsSent.includes(fr.to))from.friendRequestsSent.push(fr.to)}const to=state.users.find(u=>u.id===fr.to);if(to){to.friendRequestsReceived=to.friendRequestsReceived||[];if(!to.friendRequestsReceived.includes(fr.from))to.friendRequestsReceived.push(fr.from);if(state.user.id===to.id){state.user.friendRequestsReceived=state.user.friendRequestsReceived||[];if(!state.user.friendRequestsReceived.includes(fr.from))state.user.friendRequestsReceived.push(fr.from);toast("🤝 New friend request from "+(from?from.display:"someone"),"info",4000)}}}}
  else if(msg.type==="admin-action"){if(state.user&&(state.user.role==="admin"||state.user.role==="moderator")){if(msg.action==="ban"&&msg.target){const u=state.users.find(x=>x.id===msg.target);if(u){u.banned=true;u.bannedReason=msg.reason||"banned"}}else if(msg.action==="delete-post"&&msg.target){await del("posts",msg.target);state.posts=state.posts.filter(p=>p.id!==msg.target);if(state.view==="feed")renderFeedInto($("#main-content"))}}}
  else if(msg.type==="ping"){console.log("[sync] ping from",msg.from,sender?sender.display:"?")}
  else if(msg.type==="raw"){console.log("[sync] raw:",msg.data)}
  /* Live user-lookup: another device is asking 'do you know @username?' — if we do, respond with their record */
  else if(msg.type==="user-lookup"){if(msg.lookup&&syncEnabled){const q=msg.lookup.toLowerCase().replace(/^@/,"");const found=state.users.find(u=>u.username.toLowerCase()===q||u.email.toLowerCase()===q);if(found&&found.id!==msg.from){const safeUser=Object.assign({},found);delete safeUser.passHash;delete safeUser.activeSessionId;publishToSync(PUBLIC_TOPIC,{type:"user",from:state.user.id,data:safeUser});console.log("[sync] responded to lookup for",q,"— sent record of",found.display)}}}
  /* Incoming lookup response: a "user" message we receive in response to our lookup will be handled by the user handler above (case where the user is new to us) */
  else if(msg.type==="visit"){if(state.stats){state.stats.online=Math.max(state.stats.online||1,msg.online||1);updateTicker()}}}
function updateSyncStatusUI(){const el=$("#sync-status-chip");if(el){el.textContent=syncStats.connected?"🟢 Synced · "+syncStats.messagesReceived+" in · "+syncStats.messagesSent+" out":"🔴 Offline";el.className="chip"+(syncStats.connected?" active":"")}}
function broadcastToSync(type,data){if(!syncEnabled)return;publishToSync(PUBLIC_TOPIC,{type,from:state.user.id,data});publishToSync(getInboxTopic(state.user),{type,from:state.user.id,data})}

/* ---------- 27m. Direct P2P via WebRTC (no server, manual code exchange) ---------- */
const ICE_SERVERS={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"},{urls:"stun:stun2.l.google.com:19302"},{urls:"stun:stun3.l.google.com:19302"},{urls:"stun:stun4.l.google.com:19302"}]};
let p2pPending=null;
const p2pConnections={};const p2pChannels={};
async function createP2POffer(){if(!window.RTCPeerConnection){toast("WebRTC not supported","error");return null}p2pPending=new RTCPeerConnection(ICE_SERVERS);const dc=p2pPending.createDataChannel("ok-p2p",{ordered:true});setupP2PDataChannel(dc,"pending");const offer=await p2pPending.createOffer();await p2pPending.setLocalDescription(offer);await waitForIceGathering(p2pPending);const code=btoa(JSON.stringify({type:"offer",sdp:p2pPending.localDescription,from:state.user.id,fromDisplay:state.user.display}));return code}
async function acceptP2POffer(codeStr){let parsed;try{parsed=JSON.parse(atob(codeStr))}catch(e){toast("Invalid code","error");return null}if(parsed.type!=="offer"){toast("Not an offer code","error");return null}const pc=new RTCPeerConnection(ICE_SERVERS);pc.ondatachannel=(e)=>setupP2PDataChannel(e.channel,parsed.from);await pc.setRemoteDescription(parsed.sdp);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await waitForIceGathering(pc);p2pConnections[parsed.from]=pc;return btoa(JSON.stringify({type:"answer",sdp:pc.localDescription,to:parsed.from,toDisplay:parsed.fromDisplay,from:state.user.id,fromDisplay:state.user.display}))}
async function completeP2PConnection(answerStr){let parsed;try{parsed=JSON.parse(atob(answerStr))}catch(e){toast("Invalid answer","error");return}if(parsed.type!=="answer"){toast("Not an answer code","error");return}if(!p2pPending){toast("No pending offer — generate one first","error");return}try{await p2pPending.setRemoteDescription(parsed.sdp);p2pConnections[parsed.from]=p2pPending;p2pPending=null;toast("⏳ Connecting to "+parsed.fromDisplay+"…","info")}catch(e){toast("Connection failed: "+e.message,"error")}}
function setupP2PDataChannel(dc,peerId){dc.onopen=()=>{console.log("[p2p] channel open with",peerId);p2pChannels[peerId]=dc;dc.send(JSON.stringify({type:"hello",from:state.user.id,data:state.user}));toast("🤝 P2P connected","success");if(state.view==="settings")renderSettingsInto($("#main-content"))};dc.onclose=()=>{console.log("[p2p] closed with",peerId);delete p2pChannels[peerId];delete p2pConnections[peerId];toast("P2P disconnected","info")};dc.onerror=(e)=>console.error("[p2p] error",e);dc.onmessage=async(e)=>{try{const msg=JSON.parse(e.data);await handleSyncMessage(msg)}catch(err){console.error("[p2p] parse err",err)}}}
function waitForIceGathering(pc,timeout=3000){return new Promise(resolve=>{if(pc.iceGatheringState==="complete"){resolve();return}const check=()=>{if(pc.iceGatheringState==="complete"){pc.removeEventListener("icegatheringstatechange",check);resolve()}};pc.addEventListener("icegatheringstatechange",check);setTimeout(resolve,timeout)})}
function sendToPeers(msg){const json=JSON.stringify(msg);let sent=0;Object.values(p2pChannels).forEach(dc=>{if(dc.readyState==="open"){try{dc.send(json);sent++}catch(e){}}});return sent}
function showCodeModal(title,code){const m=el("div",{class:"modal open"});const card=el("div",{class:"modal__card"});card.appendChild(el("div",{class:"modal__head",html:`<h3>${title}</h3>`}));card.appendChild(el("div",{class:"modal__close",html:icon("x"),onclick:()=>m.remove()}));const ta=el("textarea",{class:"textarea",style:"width:100%;min-height:120px;font-family:var(--mono);font-size:11px;word-break:break-all",readonly:true,text:code});card.appendChild(ta);card.appendChild(el("div",{class:"row",style:"gap:8px;margin-top:10px"},[el("button",{class:"btn btn--primary btn--sm",text:"📋 Copy",onclick:()=>{navigator.clipboard?.writeText(code);toast("Copied","success")}}),el("button",{class:"btn btn--ghost btn--sm",text:"Close",onclick:()=>m.remove()})]));m.appendChild(card);document.body.appendChild(m)}

onclick:()=>{if(!f.allowedIPPrefixes.includes("127.0.0.1"))f.allowedIPPrefixes.push("127.0.0.1");saveSettings();renderSettingsInto(container)}})]))}
  /* Network type filter */if(f.mode==="network-type"){card.appendChild(el("h4",{style:"margin-top:14px;margin-bottom:8px",text:"📡 Allowed network types"}));card.appendChild(el("p",{class:"muted tiny",text:"Devices on these network types will be allowed to connect."}));const types=[{v:"public-internet",d:"🌍 Public internet (real WAN IP)"},{v:"private-LAN",d:"🏠 Behind router/NAT (192.168.x.x, 10.x.x.x)"},{v:"localhost",d:"💻 Localhost (127.0.0.1)"},{v:"link-local",d:"🔗 Link-local (169.254.x.x)"}];types.forEach(t=>{const on=f.allowedNetworkTypes.includes(t.v);card.appendChild(el("div",{class:"settings__row"},[el("div",{class:"meta"},[el("b",{text:t.v}),el("small",{text:t.d})]),el("div",{},[el("div",{class:"toggle"+(on?" on":""),onclick:e=>{e.target.classList.toggle("on");if(e.target.classList.contains("on")){if(!f.allowedNetworkTypes.includes(t.v))f.allowedNetworkTypes.push(t.v)}else{f.allowedNetworkTypes=f.allowedNetworkTypes.filter(x=>x!==t.v)}saveSettings()}})])]))})}
  /* Limited edition allowlist */if(f.mode==="limited-edition"){card.appendChild(el("h4",{style:"margin-top:14px;margin-bottom:8px",text:"⭐ Limited edition — curated allowlist"}));card.appendChild(el("p",{class:"muted tiny",text:"Only devices owned by these specific users will be allowed to connect. Use this for private circles, family, team, or VIP access. Add users by their username or paste their user ID."}));const ip=el("div",{style:"display:flex;gap:6px;margin-top:6px"},[el("input",{class:"input",id:"cf-le",placeholder:"username or user ID",style:"flex:1"}),el("button",{class:"btn btn--primary btn--sm",text:"Add",onclick:async()=>{const v=$("#cf-le").value.trim();if(!v)return;const u=state.users.find(x=>x.username.toLowerCase()===v.toLowerCase()||x.id===v);if(u){if(!f.limitedEditionPeers.includes(u.id)){f.limitedEditionPeers.push(u.id);saveSettings();renderSettingsInto(container);toast("Added "+u.display,"success")}else{toast("Already in allowlist","info")}}else{toast("User not found","error")}}})]);card.appendChild(ip);if(f.limitedEditionPeers.length){const list=el("div",{style:"margin-top:10px"});f.limitedEditionPeers.forEach(uid=>{const u=state.users.find(x=>x.id===uid);list.appendChild(el("div",{class:"settings__row"},[el("div",{class:"meta"},[el("b",{text:esc(u?.display||uid.slice(0,8))}),el("small",{text:u?("@"+u.username):uid})]),el("div",{},[el("button",{class:"btn btn--ghost btn--sm",text:"Remove",onclick:()=>{f.limitedEditionPeers=f.limitedEditionPeers.filter(x=>x!==uid);saveSettings();renderSettingsInto(container)}})])]))});card.appendChild(list)}else{card.appendChild(el("p",{class:"muted tiny",style:"margin-top:8px",text:"No one in your limited edition yet. Add users above to enable curated P2P."}))}}
  /* Stats / status */card.appendChild(el("h4",{style:"margin-top:14px;margin-bottom:8px",text:"📊 Filter status"}));const stat=el("div",{id:"cf-stats"});card.appendChild(stat);setTimeout(()=>{const connected=Object.keys(peerChannels);const allowed=connected.filter(pid=>{const u=state.users.find(x=>x.id===pid);return isPeerAllowed(u?.networkInfo,pid)});stat.innerHTML=`<div class="settings__row"><div class="meta"><b>Active mode</b><small>Current filter rule</small></div><div><span class="chip active">${f.mode}</span></div></div><div class="settings__row"><div class="meta"><b>Connected peers</b><small>Currently in P2P mesh</small></div><div><span class="small">${connected.length} peer(s)</span></div></div>${f.mode!=="all"?`<div class="settings__row"><div class="meta"><b>Passing filter</b><small>Would be allowed under current rule</small></div><div><span class="small">${allowed.length} / ${connected.length}</span></div></div>`:""}`},100);

async function autoCreateP2POffer(targetId){if(!window.RTCPeerConnection)return;if(peerChannels[targetId]||pendingOffers[targetId])return;const u=state.users.find(x=>x.id===targetId);if(!u)return;console.log("[p2p-discovery] creating offer for:",u.display);try{const pc=new RTCPeerConnection(ICE_SERVERS);const dc=pc.createDataChannel("ok-p2p-auto",{ordered:true});setupAutoP2PChannel(dc,targetId);const offer=await pc.createOffer();await pc.setLocalDescription(offer);await waitForIceGathering(pc);pendingOffers[targetId]={pc,sdp:pc.localDescription};peerConnections[targetId]=pc;const msg={type:"peer-offer",from:state.user.id,fromDisplay:state.user.display,to:targetId,sdp:pc.localDescription,ts:Date.now()};await fetch(NTFY_BASE+"/"+PEER_DISCOVERY_TOPIC,{method:"POST",body:JSON.stringify(msg),headers:{"Content-Type":"text/plain"}});console.log("[p2p-discovery] offer sent to:",u.display);setTimeout(()=>{if(pendingOffers[targetId]){delete pendingOffers[targetId];console.log("[p2p-discovery] offer expired for:",u.display)}},30000)}catch(e){console.error("[p2p-discovery] offer failed:",e)}}
async function autoAcceptP2POffer(offerSdp,fromId,fromDisplay){if(!window.RTCPeerConnection)return;if(peerChannels[fromId])return;console.log("[p2p-discovery] accepting offer from:",fromDisplay);try{const pc=new RTCPeerConnection(ICE_SERVERS);pc.ondatachannel=(e)=>setupAutoP2PChannel(e.channel,fromId);await pc.setRemoteDescription(offerSdp);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await waitForIceGathering(pc);peerConnections[fromId]=pc;const msg={type:"peer-answer",from:state.user.id,fromDisplay:state.user.display,to:fromId,sdp:pc.localDescription,ts:Date.now()};await fetch(NTFY_BASE+"/"+PEER_DISCOVERY_TOPIC,{method:"POST",body:JSON.stringify(msg),headers:{"Content-Type":"text/plain"}});console.log("[p2p-discovery] answer sent to:",fromDisplay)}catch(e){console.error("[p2p-discovery] accept failed:",e)}}
async function autoCompleteP2P(answerSdp,fromId){if(!pendingOffers[fromId]){return}const{pc}=pendingOffers[fromId];delete pendingOffers[fromId];try{await pc.setRemoteDescription(answerSdp);peerConnections[fromId]=pc;console.log("[p2p-discovery] connection completing with:",fromId)}catch(e){console.error("[p2p-discovery] complete failed:",e)}}
function setupAutoP2PChannel(dc,peerId){dc.onopen=()=>{console.log("[p2p-auto] connected to:",peerId);peerChannels[peerId]=dc;const u=state.users.find(x=>x.id===peerId);toast("🤝 P2P connected"+(u?" to "+u.display:""),"success");dc.send(JSON.stringify({type:"hello",from:state.user.id,data:state.user,networkInfo:networkInfo}));const d=$("#peer-list");if(d)updatePeerList(d)};dc.onclose=()=>{console.log("[p2p-auto] disconnected from:",peerId);delete peerChannels[peerId];delete peerConnections[peerId];const d=$("#peer-list");if(d)updatePeerList(d)};dc.onerror=(e)=>console.error("[p2p-auto] error:",e);dc.onmessage=async(e)=>{try{const msg=JSON.parse(e.data);if(msg.type==="hello"){const u=state.users.find(x=>x.id===msg.from);if(u&&msg.networkInfo){u.networkInfo=msg.networkInfo;await put("users",u)}}await handleSyncMessage(msg)}catch(err){console.error("[p2p-auto] parse error:",err)}}}
function sendToAllPeers(msg){const json=JSON.stringify(msg);let sent=0;Object.values(peerChannels).forEach(dc=>{if(dc.readyState==="open"){try{dc.send(json);sent++}catch(e){}}});return sent}

async function init(){applySettingsToDOM();await cloudInit();const cloudData=await cloudFetchAll();if(cloudData){const merged=await cloudMerge(cloudData);if(merged>0){console.log("[cloud] merged",merged,"records from cloud");toast("☁️ Cloud sync: "+merged+" records merged","success",3000)}else{console.log("[cloud] no new records from cloud")}}await reloadAll();await ensureDefaultAdmin();const restored=await restoreSession();if(restored){state.view="feed";startGlobalSync();detectNetworkInfo().then(()=>startPeerDiscovery())}else{state.view="landing"}state.stats.visits=(state.stats.visits||0)+1;state.stats.online=Math.max(1,state.stats.online||1);await put("stats",state.stats);emit("visit",{online:state.stats.online});updateTicker();setInterval(updateTicker,5000);if(cloudEnabled){setInterval(async()=>{const d=await cloudFetchAll();if(d){const m=await cloudMerge(d);if(m>0){await reloadAll();if(state.view==="feed")renderFeedInto($("#main-content"))}}cloudWriteNow()},60000)}await render();
  /* fab */$("#fab").onclick=()=>{if(state.user)openComposer();else{state.view="auth";render()}};
  /* presence heartbeat */if(state.user){updatePresence("online");setInterval(()=>{if(state.user&&document.visibilityState==="visible")updatePresence("online");else if(state.user)updatePresence("away")},30000);document.addEventListener("visibilitychange",()=>{if(state.user)updatePresence(document.visibilityState==="visible"?"online":"away")});window.addEventListener("beforeunload",()=>{if(state.user)updatePresence("offline")})}
  /* keyboard shortcuts */document.addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey){if(e.key==="k"||e.key==="K"){e.preventDefault();openGlobalSearch()}if(e.key==="n"||e.key==="N"){e.preventDefault();if(state.user)openComposer()}else if(e.key==="/"){e.preventDefault();go("search",{q:""})}}if(e.key==="Escape"){const m=$(".modal.open");if(m)m.remove();const mn=$(".menu.open");if(mn)mn.remove()}});if(location.hash.startsWith("#post-")){const id=location.hash.slice(6);const p=state.posts.find(x=>x.id===id);if(p)openVideoModal(p)}window.addEventListener("hashchange",()=>{if(location.hash.startsWith("#post-")){const id=location.hash.slice(6);const p=state.posts.find(x=>x.id===id);if(p)openVideoModal(p)}})}
init().catch(e=>{console.error(e);toast("Init error: "+e.message,"error")});
})();
